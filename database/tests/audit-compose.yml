services:
  postgres:
    image: postgres:latest
    container_name: aeralyth-audit-db-suite-20260912
    restart: "no"
    mem_limit: 1g
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, pg_stat_statements.track=all, -c, compute_query_id=on]
    environment:
      POSTGRES_USER: aeralyth
      POSTGRES_PASSWORD: aeralyth
      POSTGRES_DB: aeralyth
    ports: ["127.0.0.1:55434:5432"]
    volumes:
      - ../init:/aeralyth-migrations:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aeralyth -d aeralyth"]
      interval: 1s
      timeout: 5s
      retries: 30
