[package]
name = "aeralyth-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-multipart = "0.7.2"
actix-web = "4"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-types = "1"
base64 = "0.22.1"
bcrypt = "0.19.3"
bytes = "1"
deadpool-postgres = "0.14.1"
dotenvy = "0.15"
ed25519-dalek = "2.2.0"
futures-util = "0.3.32"
getrandom = "0.4.2"
hmac = "0.12.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
tokio-postgres = { version = "0.7.17", features = ["with-time-0_3"] }
time = "0.3.47"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
