[package]
name = "aeralyth-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-multipart = "0.8.5"
actix-web = "4"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-smithy-runtime-api = "1"
aws-types = "1"
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1"
brotli = "=9.1.1"
flate2 = "=1.1.9"
zstd = "=0.14.3"
deadpool-postgres = "0.14.1"
dotenvy = "0.15"
ed25519-dalek = "3.0.0"
futures-util = "0.3.32"
getrandom = "0.4.2"
hmac = "0.13.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tokio-postgres = { version = "0.7.17", features = ["with-time-0_3"] }
time = "0.3.47"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
